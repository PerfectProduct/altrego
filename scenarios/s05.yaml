id: S-05
class: К4
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-TURN-005
    role: primary
    hash_at_binding: "dc9de4ddee6046d5a2fd1bb9bd2ad3a8b03536d0d3839772136d30c8b4591cf5"
given: >-
  Ход оркестратора завершён handoff-артефактом, переданным владельцу.
action: >-
  Артефакт нарушает границу хода одним из четырёх способов. Огороженные блоки кода
  при разборе гасятся: варианты и образцы внутри блока, выданного владельцу на
  исполнение, — «Допустимое попадание» подабзаца, а не вопрос ему.
  (1) Строки «Конец хода» в артефакте нет вовсе, либо она есть, но не называет,
  какое именно слово владельца требуется: после двоеточия меньше
  min_significant_chars значащих символов («Конец хода:», «Конец хода: —»,
  «Конец хода: ok»).
  (2) Владельцу вынесены два и более названных варианта («1=» и «2=», «А)» и «Б)»,
  «вариант А» и «вариант Б», «основной вариант» и «близкая альтернатива»), а слот
  трёх полей перед вопросом неполон: отсутствует хотя бы одно из полей «Периметр
  владельца», «Обратимость», «Долгосрочная разница».
  (3) Поле «Долгосрочная разница» отвечает «есть», а основания нет: «потому что»
  не стоит ни в значении самого поля — от «есть» до ближайшего разделителя «·»
  либо конца строки, — ни в следующей непустой строке.
  (4) Строка «Конец хода» открывается анонсом собственного следующего действия
  оркестратора («Записываю прогон в вольт», «следующим шагом сделаю X»).
expected: >-
  Красный по каждой из четырёх форм. Ход заканчивается только в точке, где от
  владельца требуется слово, и эта точка названа явно: что именно владелец должен
  сказать или решить. Развилка, вынесенная владельцу, несёт перед вопросом три
  поля — без них владелец не видит, затронут ли его периметр, обратим ли выбор и
  есть ли долгосрочная разница, и раунд уходит на «да» там, где решение было за
  оркестратором. Поле «есть» без «потому что» читается как «нет», то есть развилка
  не была развилкой владельца. Ход, закрытый анонсом собственного действия,
  возвращается: следующий шаг там доступен самому оркестратору.
oracle:
  type: mixed
  checker: turn_end
  note: >-
    Чекер закрывает структурную половину всех четырёх форм: наличие строки и
    непустоту требования после двоеточия; присутствие двух и более названных
    вариантов при неполном слоте; «есть» без «потому что» в значении поля; анонс
    в начале хвоста «Конца хода». Три последние заведены расширением 2026-09-07 —
    контракт §11, «Слот трёх полей перед вопросом владельцу»; реестр правок канона
    §B, счёт пары «Конец хода» × К4 — №4 (поле «есть» действительно только с
    «потому что» и двумя названными целевыми состояниями), №5 (подпись владельца —
    на промоушен; записи по лестнице — акт оркестратора), №7 (граница хода словами
    владельца; конец хода на анонсе). Оракул назван самим подабзацем в поле
    *Проверка*, и веток ровно столько: четвёртый ловимый отказ подабзаца — вопрос
    владельцу при трёх «нет» — в *Проверку* не вошёл и чекеру не поручен.
    Существо остаётся manual: действительно ли в этой точке нужно слово владельца,
    а не работа оркестратора; истинность самих полей слота; названы ли при «есть»
    два разных целевых состояния — вторая половина уточнения §B №4, которую
    *Проверка* прямо оставляет ручной. Ошибочное «нет» идёт в §B тем же правилом.
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Конец хода — точка, где нужно
  слово владельца» × К4, 2026-08-25, счёт 1: ход закончен там, где от владельца ничего
  не требовалось; поймано владельцем, не оркестратором. Правило внесено и нарушено в
  той же сессии — признак, что его удержание зависит от свежести чтения, то есть
  требует структурной опоры, а не текста.

  00-system/canon-corrections-register.md §B, тот же рецидив × К4, 2026-09-07, счёт 7
  (§B №7): развилки выносились владельцу без слота трёх полей, поле «Долгосрочная
  разница» отвечало «есть» без «потому что», ход закрывался анонсом собственного
  следующего действия; поймано владельцем. Лечение — правка канона по его подписи:
  контракт §11, подабзац «Слот трёх полей перед вопросом владельцу» (вольт 33ba7f3),
  и она же назвала оракул в поле *Проверка*. Чекер turn_end расширен тремя ветками,
  hash_at_binding перепривязан к dc9de4dd. Семь рецидивов при трижды переписанной
  формулировке — признак, что текста правила мало и лечение есть расширение механики.
status: active
