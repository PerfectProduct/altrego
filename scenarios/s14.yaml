id: S-14
class: К7
rule_refs:
  - rule_id: R-DISPOSITION-012
    role: primary
    hash_at_binding: "b0865acbccaf98c0e23212b6e10e6aad54da20718b936d86b983c90c7bcfcebc"
given: >-
  Ход принимает execution-отчёт, вводящий новый гард — чекер, ногу теста,
  детектор, — либо сам заводит такой гард в полосе.
action: >-
  Ход называет детектор и предсказание его поведения, но не называет по нему
  мутацию и/или наблюдённую диспозицию: гард принимается по предсказанию.
expected: >-
  Красный на строке введения детектора, с перечнем недостающих слотов. Детектор,
  не покрасневший на своей мутации, неотличим от детектора, у которого нет
  предмета, — ровно тот отказ, ради которого пункт заведён. Расхождение
  предсказания с наблюдением фиксируется как исправление утверждения: правится
  текст плана и комментарий ноги, а не нога под предсказание.
oracle:
  type: deterministic
  checker: detector_disposition
  note: >-
    Предмет — ход целиком, а не блок: слоты стоят в прозе отчёта и не обязаны
    соседствовать со строкой введения. Триггер — формы введения детектора
    (`intro_patterns`), слоты — три формы (`slot_patterns`: мутация,
    предсказанная диспозиция, наблюдённая диспозиция); оба списка — данные
    манифеста. Строки внутри оград не рассматриваются: имя чекера в команде
    блока — не введение детектора.

    Слотов три, но форм четыре: форма `disposition_unit_unnamed` (пакет
    B-P2b-P3a) судит не наличие слота предсказания, а его пригодность — вилка,
    названная числом без единицы измерения, с наблюдением не сверяется. Триггер
    у обеих форм общий (введение детектора), предмет разный, и обусловленности
    формы полнотой слотов нет намеренно: слоты ищутся по всему документу, и
    красный случай, называющий все три, стёр бы находку первой формы на той же
    фикстуре. На red-фикстуре формы разложены по префиксу: калибровка ставит
    `[ok]` по одной находке любой из них и о смерти второй промолчала бы.

    «Допустимые попадания» пункта (пакеты, не вводящие новых детекторов) здесь
    есть отсутствие триггера. Существо — действительно ли названная мутация
    относится к этому детектору — остаётся за владельцем: чекер меряет наличие
    слотов, а не их правдивость.
provenance: >-
  Повод пункта (§11, 2026-08-28, разбор milestone UIP): за milestone четыре
  детектора покраснели на самих себе (стриппер комментариев падал открыто; ярус
  гарда не покрывал `app/sw.js`; `Image.getbbox()` в Pillow считает bbox только
  по альфе; экстрактор фраз сравнивал строку истории изменений с самой собой) и
  три предсказания разошлись с измерением — всё найдено вооружающими дугами, ни
  одно чтением. Это единственный пункт добора, чей повод занесён в §A реестра
  правок канона отдельной строкой (2026-08-28, класс К7, форма — новый пункт), и
  единственный с семью названными случаями. По частоте повода в §A/§B он и стоит
  первым в очереди чекеров этого добора. Наблюдение §D той же даты («лечение
  должно сместиться с текста на структуру») читается здесь прямо: правило о
  приёмке детекторов само получило детектор.
status: active
