id: S-23
class: К6
rule_refs:
  - rule_id: R-SHELL-003
    role: primary
    hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
given: >-
  Ход выдаёт владельцу огороженный блок, исполняемый в оболочке — bash либо
  PowerShell, — в котором значение состояния сперва читается в имя (файл, версия,
  конфигурация), а затем по этому имени идёт команда, меняющая состояние.
action: >-
  Между чтением и записью нет проверки, что чтение состоялось: ни обрыва блока на
  самой строке чтения, ни проверки имени перед записью. Форма проверки зависит от
  оболочки, и её отсутствие меряется по диалекту, а не по одному синтаксису.
expected: >-
  Красный на строке записи, с адресом строки чтения. При провале чтения оболочка
  продолжает следующей командой: в bash подстановка внутри объявления маскирует
  код возврата (ShellCheck SC2155), и `set -e` его не видит; в PowerShell упавшая
  ступень конвейера оставляет имя со значением прошлого сеанса консоли. Запись
  ложится по пустому либо по чужому значению, и провал становится неотличим от
  успеха — то самое, что «Исполнимость shell-блока» запрещает вопросом (3).
  Оправдывает только проверка МЕЖДУ чтением и записью либо обрыв блока на самом
  чтении. Сцепка `&&` слева от чтения или сцепляющая чтение с печатью не
  оправдывает; `-ErrorAction Stop` оправдывает лишь на последней ступени
  конвейера чтения — висящий на первой, он зеленит собственный повод.
oracle:
  type: deterministic
  checker: unguarded_state_write
  note: >-
    Инвариант — в коде, диалект — в данных: словари чтения, эффекта и проверки
    лежат в `linter/manifest.yaml` записью на диалект (`config.dialects`), диалект
    выбирается языком ограды, блок без языка судится `dialect_default`. Оболочка в
    модуле не названа ни разу — иначе правило стало бы правилом про bash, а
    инцидент был в PowerShell.

    Почему отдельный чекер, а не форма `shell_mech` (S-07). Охват блоков у чекера
    один на все его формы, а этой форме нужен PowerShell. Отданная `shell_mech`,
    она заставила бы форму `windows_path` покраснеть на пути `D:\…`, который в
    PowerShell верен: green-фикстура `shell_mech` дала бы `green-fixture-red` и
    дисквалификацию чекера на каждом прогоне (измерено). Расширять
    `shared.shell_langs` нельзя тем более — на него смотрят девять чекеров, и двое
    дома промптов от расширения молча СУЖАЮТСЯ (`linter/prompts.py` снимает блок,
    чей язык лежит в `shell_langs`). Охват расширен одним ключом
    `shell_langs_extra`, действующим только на этот чекер.

    Правая часть, порождающая значение (`$(mktemp)`, `$(date …)`), чтением
    состояния не считается: там нечему не состояться. Голый `cd` исключён явно —
    он предмет формы `cd_without_chain` (S-07), и один отказ не называется дважды.

    Чекер меряет наличие проверки, а не её истинность: ловит ли эта проверка этот
    отказ — остаётся за владельцем.
provenance: >-
  00-system/canon-corrections-register.md §D, наблюдения 2026-09-08 (3), пункт 3 —
  К6 с материальным ущербом. Блок правки `claude_desktop_config.json` в PowerShell
  не имел проверки между чтением и записью: `ConvertFrom-Json` упал на висячей
  запятой, оболочка продолжила построчно, `$j` осталась объектом из прошлого
  сеанса консоли, и запись затёрла правку владельца. Канон несёт «цепочки с
  побочным эффектом — через `&&`», но это формулировка про bash, и переноса на
  PowerShell не произошло. Лечение названо самим пунктом и здесь исполнено
  дословно: «между чтением состояния и записью по нему стоит проверка, что чтение
  состоялось; форма проверки зависит от оболочки».

  Сценарий заведён на ход позже механики. Чекер приземлился пакетом B-P2b-P1
  (2026-09-10) без сценария: `S-07` дословно занят `shell_mech` (`oracle.checker`),
  а корпус — ярус 2, подпись владельца. Отставание названо owner-актом ADR-053
  (23), `1=а`, вместе с ценой («в манифесте живёт детектор, которого функция
  потерь петли не видит») и триггером пересмотра; этот сценарий его закрывает.
status: active
