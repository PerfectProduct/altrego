id: S-03
class: К2/К3
# Ссылки на пункты канона. role: primary — норма, которую сценарий
# держит (только primary участвует в проверке расхождения хэшей и в
# учёте «мёртвой нормы»); secondary — пункт, на который сценарий
# опирается или который поясняет, без права судить о его свежести.
rule_refs:
  - rule_id: R-SHELL-003
    role: primary
    hash_at_binding: "48f5723edf7eebfba2508388937a8fc90d720cd73392336f157c2801fb110850"
given: >-
  Артефакт содержит блок, исполняемый в оболочке — оградой с языком (bash или
  PowerShell) либо маркером `Handoff for shell`, — в котором есть строка в
  предпосылочной форме: она адресуется к состоянию среды по имени, взятому не из
  измерения этого хода. Одна форма (`pip_install_outside_venv`) ловится и вне
  блока: инструкция владельцу в прозе исполняется так же буквально.
action: >-
  Блок выдаётся владельцу без предшествующей измеряющей строки, которая это
  состояние вернула бы (список сервисов, список устройств, путь интерпретатора).
expected: >-
  Красный на предпосылочной строке. Форма падает на предпосылке, а не на предмете,
  и провал становится неотличим от отсутствия предмета. Оправдание — по форме, а
  не одно на все: (а) измеряющая строка ВЫШЕ, в окне той же ограды — список
  сервисов, список устройств, `gh auth status`; (б) названный параметр на ТОЙ ЖЕ
  строке — путь venv у установки, пин версии у переустановки, печать конечного
  адреса (`-w "%{url_effective}"`) либо `--max-redirs 0` у `curl -L`; строкой выше
  такая форма не оправдывается намеренно: зонд выше меряет другой запрос, и
  редирект не обязан совпасть у HEAD и у POST; (в) у длинного heredoc оправдания
  нет вовсе — там мерится предел в строках, потому что предпосылка не об имени, а
  о канале вставки. Одна форма (`push_workflow_without_scope`) читает
  предшествующую строку как ТРИГГЕР, а не как оправдание: staged-файл workflow
  включает требование о праве токена, а не снимает его.
oracle:
  type: deterministic
  checker: env_presupposition
provenance: >-
  00-system/canon-corrections-register.md §B, рецидив «Исполнимость shell-блока»,
  вопрос 2 × К2/К3, 2026-08-28, счёт 1: имя сервиса Cloud Run (`theygrow-web`) взято
  по памяти, блок упал на предпосылке. Местная история инцидента: `pip install --user`
  в среде PEP 668 — провал на предпосылке о том, что вне venv установка разрешена.
status: active
