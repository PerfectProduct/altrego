id: S-24
class: К1
rule_refs:
  - rule_id: R-PROV-001
    role: primary
    hash_at_binding: "7364c332f12274cb11f6230408a4f72b35018157037743d51a8c4c9b89640c50"
given: >-
  Ход утверждает о состоянии репозитория — составе правки или пакета, чистоте
  рабочего дерева, незакоммиченном, составе коммита — и рядом называет команду,
  которой это измерено: провенанс соблюдён, требование S-02 удовлетворено.
action: >-
  Область названной команды уже области утверждения: `git diff` без `--cached` не
  видит неотслеживаемых файлов, вывод обрезан `head`/`tail`, окно журнала
  ограничено числом строк, `ls` не рекурсивен, обход ограничен `-maxdepth 1`.
  Рядом нет ни покрывающей команды, ни названного вслух предела.
expected: >-
  Красный на строке утверждения, с названием того, чего команда не видит. Счётчик
  отвечает на свой вопрос верно, а утверждение задаёт другой, и потому отказ
  невидим именно там, где провенанс на месте: расхождение всплывает не здесь, а на
  следующей команде. Оправдывает покрывающая команда рядом
  (`git status --porcelain`, `git ls-files --others`, `git show --stat`) либо
  предел, названный словами. Труба сама по себе покрытия не отменяет —
  `git status --porcelain | wc -l` считает всё; отменяет усечение. Фильтр пробелов
  (`-w`) оправдывает соседний `whitespace_diff` и этот класс НЕ оправдывает: он
  меняет, что считается правкой, а не то, какие файлы вообще попадают в счёт.
oracle:
  type: deterministic
  checker: repo_state_claim
  note: >-
    Предмет начинается там, где замолкает `claim_provenance` (S-02): тот при виде
    команды рядом делает `continue`, этот обязан краснеть ровно там. Полярность
    оправдания обратная, и две противоположные меры в одной функции читались бы
    как одна — отсюда отдельный чекер, а не шестая нога. Второй довод — калибровка
    идёт по чекеру, а не по форме: red-фикстура `claim_provenance` и так даёт
    двенадцать находок, и умершая форма внутри неё осталась бы невидимой.

    Область утверждения — положительный список (`claim_scopes`), а не изъятие:
    судятся только утверждения с названным предметом. Утверждение, чей предмет И
    ЕСТЬ дифф («В diff 4 файла — выдача `git diff --stat`»), в список не входит и
    молчит по построению — там область команды равна области утверждения.

    Адрес пункта канона («строку 113 файла контракта») судит нога 3
    `claim_provenance`, и такие строки исключены явно: один отказ не называется
    дважды. Пункт списка с инфинитивом («Сверить правку и прислать вывод целиком»)
    адресован владельцу и притязания о состоянии не делает.

    Чекер меряет соотношение областей, а не истинность счёта: столько ли файлов в
    дереве — остаётся за владельцем. Экспозиция на калибровочном наборе — ноль, и
    это «не измерено», а не «чисто»: оба артефакта набора датированы 2026-08-31,
    до того как полоса завела свой git-обиход. Вид артефакта измерен, а не
    унаследован: 7 находок на 1000 строк spec-корпуса — отсюда `kinds`
    `[handoff, spec]`.
provenance: >-
  Контракт §11, «Провенанс утверждений оркестратора», *Момент:* «любое утверждение
  о состоянии репозитория, прогона, артефакта или устройства». Повод с
  материальным расхождением — ход полосы 2026-09-10: состав пакета мерен
  `git diff --stat main` и отчитан владельцу как 9 путей и 356 строк; коммит
  показал 14 путей и 1205 строк. `git diff` не видит неотслеживаемых файлов —
  счётчик структурно не видел трети предмета, и утверждение о состоянии
  репозитория стояло на нём. Провенанс при этом был соблюдён: команда названа,
  выдача приведена; потому отказ и не был виден.

  Сценарий заведён на ход позже механики: чекер приземлился пакетом B-P2b-P2
  (2026-09-10) без сценария по owner-акту ADR-053 (23), `1=а`, — S-02 держит
  `claim_provenance` и перечисляет свои формы закрытым списком, а этот класс в нём
  не описан.
status: active
