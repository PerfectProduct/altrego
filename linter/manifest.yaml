# Реестр чекеров хода-линтера v0.
#
# Каждый чекер — модуль в linter/checkers/ с чистой функцией
#   check(text: str, config: dict) -> list[Finding{line, checker, severity, message}]
# Без сети, без LLM, без файловых сайд-эффектов.
#
# config чекера = shared + собственный config (собственный побеждает).
# Списки форм S-03 живут здесь: расширение формы — правка данных, не кода.
#
# kinds — виды артефактов, на которых чекер имеет право говорить (run.py --kind):
#   handoff — артефакт хода, выдаваемый владельцу (по умолчанию);
#   spec    — входное задание оркестратору.
# Чекер с непустым полем `config.gates` — гейт: run.py прогоняет его до
# остальных, и на его срабатывании названные там чекеры не запускаются вовсе
# (их результат в отчёте — «не измерено», а не «ноль находок»).
#
# Чекер без поля kinds работает на всех видах. Предпосылки среды, провенанс
# утверждений и конец хода меряются в артефакте хода: в задании все трое
# говорят о предмете, которого в задании ещё нет (задание не заканчивается
# словом владельца — оно им начинается), — отсюда kinds: [handoff] у них.
# По той же причине kinds: [handoff] у двух чекеров дома промптов
# (prompt_self_assessment, sources_trailer): самооценка и Sources-трейлер —
# обязанности эмитирующего хода, а не входного задания оркестратору.

version: 0

shared:
  shell_langs: [bash, sh, shell, zsh, console, shell-session]
  handoff_markers: ["Handoff for shell", "Handoff for git", "Handoff for Claude Code"]
  handoff_lookback: 3
  # Словарь глаголов исполнения. Живёт в shared, потому что читателей два:
  # owner_action_block (пункт поручает команду — где блок?) и artifact_integrity
  # (ход поручает действия — а блоков нет вовсе). Две копии списка разошлись бы
  # молча: анти-вакуумная нога линтера перестала бы видеть ровно те поручения,
  # по которым краснеет owner_action_block. Стартовый набор — глаголы,
  # названные владельцем при заведении owner_action_block 2026-08-31.
  # Только личные формы и инфинитив: «вывод прогона» — не поручение.
  action_verbs:
    - '\bпрогн(?:ать|ал|али)\b'
    - '\bпрогони(?:те)?\b'
    - '\bзакоммит(?:ить|ь|ьте|ил|или)\b'
    - '\bвыполн(?:ить|и|ите|ил|или|ять|яйте)\b'
    - '\bзапуст(?:ить|и|ите|ил|или)\b'

  # Признак копируемого промпта. Живёт в shared по той же причине, что и
  # action_verbs: читателей два — prompt_self_assessment (промпт есть, а
  # самооценки нет) и sources_trailer (промпт кодирует решение вольта, а
  # трейлера нет). Две копии признака разошлись бы молча, и один чекер
  # перестал бы видеть ровно те блоки, по которым краснеет другой.
  #
  # Переписан 2026-09-04 с формы инцидента на инвариант (реестр правок канона
  # §D, 2026-08-31, третий случай). Прежний признак — «блок длиннее 15 строк с
  # адресацией «Задача:»/«Твоя задача»/«Your task»/«В ~/»» — описывал тот
  # промпт, на котором чекеры заводились: DR-промпт в 12 строк с адресацией
  # «Тема:» и «Вопросы исследования:» проходил мимо, наблюдено 2 находки против
  # вилки 6–10. Порог `prompt_min_lines` снят целиком, а не поднят: длина
  # признаком не является, и мёртвая данная читалась бы как действующий порог.
  #
  # Инвариант — три признака сразу (разбор: linter/prompts.py):
  #   (а) блок не набор команд владельцу: shell-язык в ограде либо доля
  #       строк-команд ≥ prompt_command_share в блоке без метки языка;
  #   (б) блок адресован исполнителю или сессии — структура задания любой формы;
  #   (в) блок несёт хотя бы один фактический параметр.
  # Признак (в) и есть механическая мера «Допустимых попаданий» пункта: в
  # go-ahead шаблона 4 и в корректирующей реплике проверять нечего.

  # (б) Структура задания: зачины разделов промпта, императив, обращение к
  # агенту, неснятый слот шаблона.
  prompt_address_patterns:
    - '^\s*[-*>]?\s*\**\s*(?:Задача|Тема|Вопросы\s+исследования|Вопросы|Контекст|Context|Принимай\s+как\s+данность|Формат\s+выхода|Output\s+format|Ограничения|Constraints|Роль|Role|Task|Твоя\s+задача|Your\s+task)\s*\**\s*[:—–-]'
    - '\bТво[яё]\s+задача\b'
    - '\bYour\s+task\b'
    - '(?<![\w~])В\s+~/'
    - '^\s*(?:\d+[.)]\s*|[-*+•]\s*)?(?:Собери|Собрать|Найди|Найти|Дай|Дать|Проверь|Проверить|Верни|Вернуть|Сделай|Сделать|Прочитай|Прочитать|Составь|Составить|Изучи|Изучить|Сравни|Сравнить|Опиши|Описать|Не\s+давай|Не\s+начинай|Не\s+пиши|Не\s+расширяй)\b'
    - '^\s*(?:Ты\b|You\s+are\b|Действуй\s+как\b|Act\s+as\b)'
    - '\[[A-Za-zА-Яа-яЁё][^\]\n]{3,}\]'

  # (в) Фактический параметр: путь, URL, идентификатор, sha, число с единицей,
  # дата, имя файла, ветка. Их наличие отличает промпт от go-ahead.
  prompt_parameter_patterns:
    - 'https?://\S+'
    - '(?:^|[\s(«"''`])(?:~|\.{1,2})?/[\w.@-]+(?:/[\w.@-]+)+'
    - '\b(?:ADR|PDR|EMV-DL)[-\s]?\d+'
    - '\bR-[A-ZА-ЯЁ]+-\d+\b'
    - '(?<![\w/])[0-9a-f]{7,40}(?![\w/])'
    - '#\d+\b'
    - '\b\d+\s*(?:строк\w*|файл\w*|тест\w*|коммит\w*|чекер\w*|сценар\w*|правил\w*|фикстур\w*|наход\w*|%|сек\w*|мс\b|ms\b|мин\w*|min\b|ч\b|GB|MB|KB)'
    - '\b\d{4}-\d{2}-\d{2}\b'
    - '\b[\w-]+\.(?:md|ya?ml|py|json|toml|txt|sh|html|css|js|ts)\b'
    - '\b(?:main|master|chore|feat|fix|release)/[\w./-]+'
    - '\bветк\w*\s+\S+'

  # (а) Строка-команда. Мера — доля таких строк среди значимых, а не наличие
  # одной: промпт вправе процитировать команду, и одна строка не делает его
  # блоком для оболочки владельца.
  prompt_command_line_patterns:
    - '^\s*(?:\$\s+)?(?:\w+=\S*\s+)*(?:git|gh|python3?|\.?/?\.venv/bin/\S+|pip3?|curl|cd|ls|cat|grep|rg|export|set|echo|printf|mkdir|rm|cp|mv|source|test|pytest|pre-commit|docker|kubectl|gcloud|adb|npm|make|sed|awk|jq|wc|find)\b'
  prompt_command_share: 0.5

  # Блок, выданный владельцу для записи в вольт (реестр, лог, ADR), промптом не
  # считается: он несёт даты и «реестр §B», но исполнителю не адресован, а
  # запись в вольт делает владелец (CLAUDE.md, «в вольт не писать»).
  prompt_owner_markers:
    - '\b(?:в|для)\s+вольт\w*'
    - '\bзапис\w+\s+(?:в|для)\s+(?:вольт\w*|реестр\w*|лог\w*|ADR)'
    - '\bстрок\w+\s+лога\b'
    - '\bблок\w*\s+владельцу\b'
  prompt_owner_lookback: 3

checkers:
  # Контроль целостности входа. Стоит первым не ради порядка вывода: поле
  # `gates` делает его гейтом — run.py прогоняет гейты до остальных чекеров и
  # на сработавшем гейте названные в `gates` чекеры не запускает вовсе,
  # помечая их в отчёте «не измерено», а не «ноль находок».
  - name: artifact_integrity
    module: linter.checkers.artifact_integrity
    kinds: [handoff]
    rule_id: R-VACUUM-007
    scenario: S-09
    description: >-
      Деградировавший вход: handoff с нулём огороженных блоков при разделе
      «Ваши действия» либо двух глаголах исполнения. Класс отказа — infra.
    config:
      section_pattern: '^[\s*_>#|-]*\**\s*Ваши\s+действия\b'
      # action_verbs — общий словарь из `shared`: тот же, по которому краснеет
      # owner_action_block.
      min_verbs: 2
      # Чекеры, у которых без ограды нет предмета. Список читают двое: сам
      # модуль — чтобы назвать их в сообщении, и run.py — чтобы их погасить.
      # Список вырос 2026-08-31 при доборе корпуса до 20 сценариев: четыре
      # новых чекера (run_id_filter, download_dir, gh_repo_scope,
      # whitespace_diff) читают только shell-блок и на входе без оград
      # дали бы тот же ноль находок. Список — данные ровно затем, чтобы
      # расти вместе с полосой; сообщение чекера строится из него.
      gates: [smoke_line, claim_provenance, shell_mech, env_presupposition,
              grep_vacuum, run_id_filter, download_dir, gh_repo_scope,
              whitespace_diff, unguarded_state_write, repo_state_claim]

  - name: shell_mech
    module: linter.checkers.shell_mech
    kinds: [handoff, spec]
    rule_id: R-SHELL-003
    scenario: S-07            # формы блока; базовые вопросы (1) и (4) сценария v0 не имеют
    description: >-
      Механика shell-блока: длина, exit, плейсхолдеры, вложенные ограды,
      путь Windows-вида, `cd` без сцепки.
    config:
      max_block_lines: 25
      placeholder_pattern: '<[A-ZА-ЯЁ0-9][A-ZА-ЯЁ0-9_-]{1,}>'
      exit_pattern: '(?:^|[;&|]\s*)exit\b'
      # Формы 2026-08-31 (инцидент: блок коммита вольта в Windows-синтаксисе
      # исполнен в bash). Шаблоны — данные: правятся здесь, без правки модуля.
      # windows_path: буква диска + двоеточие + бэкслеш среди команд блока.
      windows_path_pattern: '(?<!\w)[A-Za-z]:\\[^\s"]*'
      # cd_without_chain: `cd` последней командой строки — после него до конца
      # строки нет ни `&&`, ни `||`, ни `;`, и ниже по блоку есть ещё команды.
      cd_unchained_pattern: '(?:^|[;&|]\s*)cd\s+[^;&|]*$'
      # Оправдание: `set -e` выше по блоку обрывает блок на провале `cd` сам.
      errexit_pattern: '^\s*set\s+-[A-Za-z]*e'
      # Форма 2026-09-04 (реестр §B, рецидивы 2026-09-03/04; лечение —
      # расширение механики, owner-акт 2026-09-04, пункт 1=да).
      # pipe_truncates_error: команда с побочным эффектом под `| tail|head -N`.
      # Чтение (`gh run list | head -5`) сюда не входит: обрезка выдачи чтения
      # прячет только саму выдачу, а не отказ действия.
      side_effect_patterns:
        - '\bgit\s+(?:push|commit)\b'
        - '\bgh\s+(?:pr|issue|release|repo|secret|variable|workflow|auth)\s+(?:create|merge|close|edit|delete|upload|set|remove|refresh|login|logout|enable|disable|run|rename|sync|clone|fork)\b'
        - '\bgh\s+api\b[^|]*?(?:-X|--method|(?<![\w-])-f\b|(?<![\w-])-F\b)'
        - '\bcurl\b[^|]*?-X\s*(?:POST|PUT|PATCH|DELETE)\b'
      pipe_truncate_pattern: '\|\s*(?:tail|head)\s+(?:-n\s*)?-?\d+'
      # Оправдания: код выхода самой команды либо текст её отказа доходят до
      # владельца. `set -o pipefail` в список не входит намеренно: он меняет код
      # выхода, но обрезанный текст ошибки владельцу всё равно не показывает.
      pipestatus_pattern: '\$\{PIPESTATUS\[0\]\}'
      error_filter_pattern: '\bgrep\s+-?\w*\s*[''"]?[^|]*\b(?:error|rejected|fatal)\b'

  # Запись по непроверенному чтению. Отдельный чекер, а не форма shell_mech:
  # предмет двухдиалектный, а охват блоков у чекера один на все его формы.
  # Отдай его shell_mech — и windows_path покраснеет на пути `D:\…`, который в
  # PowerShell верен, а green-фикстура shell_mech, обязанная нести корректный
  # PowerShell-блок, дала бы green-fixture-red и дисквалификацию на каждом
  # прогоне (измерено). Расширять shared.shell_langs нельзя тем более: это
  # девять чекеров из шестнадцати, причём prompt_self_assessment и
  # sources_trailer молча СУЖАЮТСЯ (linter/prompts.py снимает блок, чей язык
  # лежит в shell_langs). Поле `scenario` не заводится: S-07 занят shell_mech
  # (его oracle.checker назван дословно), а сценарии — ярус 2; черновик S-23
  # уходит владельцу вместе с текстом канона в пакет P3. Это названная цена,
  # не молчаливый пробел.
  - name: unguarded_state_write
    module: linter.checkers.unguarded_state_write
    kinds: [handoff, spec]
    rule_id: R-SHELL-003
    description: >-
      Запись, меняющая состояние, идёт по значению предыдущего чтения, а
      проверки, что чтение состоялось, между ними нет. Класс, а не оболочка:
      форма проверки — данные по диалекту (реестр §D, 2026-09-08 (3), п. 3).
    config:
      # Единственная точка расширения охвата, действует только на этот чекер.
      shell_langs_extra: [powershell, pwsh, ps1, posh]
      # Блок без метки языка (в том числе под маркером «Handoff for shell»)
      # судится как bash — сегодняшнее поведение полосы. Нюх по содержимому
      # здесь не заводится: он был бы догадкой, а не признаком.
      dialect_default: bash
      # Голый `cd` — предмет формы cd_without_chain той же полосы. Вторая
      # находка ТОГО ЖЕ класса на той же строке называла бы один отказ дважды.
      exclude_patterns:
        - '^\s*cd\s'
      # Кавычки маскируются до сверки со словарём эффекта: иначе
      # `echo "$VER > 1.0"` и `awk '$1 > 0'` читаются как перенаправление.
      quote_spans:
        - '"[^"\n]*"'
        - '''[^''\n]*'''
      dialects:
        - name: bash
          langs: [bash, sh, shell, zsh, console, shell-session]
          # Чтение связывает ИМЯ с прочитанным состоянием: подстановка команды
          # либо обратные кавычки. Группа `var` обязательна — по ней держится
          # связь «запись по прочитанному».
          read_patterns:
            - '(?:^|&&\s*|\|\|\s*)\s*(?:(?:local|export|declare|readonly|typeset)\s+)?(?P<var>[A-Za-z_]\w*)=[^\n;&|]*(?:\$\(|`)'
          # Правая часть, ПОРОЖДАЮЩАЯ значение, состояния не читает.
          read_exclude_patterns:
            - '\$\(\s*(?:mktemp|date|uuidgen|seq|printf|echo)\b'
          effect_patterns:
            - '\bgit\s+(?:push|commit|tag|reset|checkout|restore|apply)\b'
            - '\bgh\s+(?:pr|issue|release|repo|secret|variable|workflow)\s+(?:create|merge|close|edit|delete|upload|set|remove)\b'
            - '\bcurl\b[^|]*?-X\s*(?:POST|PUT|PATCH|DELETE)\b'
            - '\bsed\s+-i\b'
            - '\btee\b'
            - '(?<![0-9&\\])>>?\s*["'']?[~./$\w]'
            - '^\s*(?:rm|mv|cp|ln)\s'
            - '\bgcloud\s+\w+\s+(?:deploy|update)\b'
            - '\bkubectl\s+(?:apply|delete|patch)\b'
            - '\bdocker\s+push\b'
          # `|| exit|return` на строке чтения обрывает блок целиком.
          guard_inline_patterns:
            - '\|\|\s*\{?\s*(?:exit|return)\b'
          guard_inline_last_stage_patterns: []
          guard_between_patterns:
            - '\[\[?[^\n]*<VAR>[^\n]*\]\]?\s*(?:\|\||&&)\s*\{?\s*(?:exit|return)\b'
            - '^\s*if\s[^\n]*<VAR>[^\n]*\b(?:exit|return)\b'
            - '^\s*(?:exit|return)\b'
          guard_block_patterns:
            - '^\s*set\s+-[A-Za-z]*e'
          # SC2155 (ADR-054 NB-43): объявление маскирует код возврата
          # подстановки, и errexit его не видит — `set -e` тут не оправдание.
          guard_block_masked_patterns:
            - '^\s*(?:local|export|declare|readonly|typeset)\s'
          var_reference: '\$\{?<VAR>\b'
          ignorecase: false
        - name: powershell
          langs: [powershell, pwsh, ps1, posh]
          read_patterns:
            - '(?:^|&&\s*|;\s*)\s*(?P<var>\$[A-Za-z_]\w*)\s*=\s*[^\n]*\b(?:Get-Content|Get-Item|Get-ChildItem|Get-ItemProperty|Import-Csv|Import-Clixml|ConvertFrom-Json|Select-String|Get-Process|Get-Service|Test-Path|Invoke-RestMethod|Invoke-WebRequest)\b'
          read_exclude_patterns: []
          effect_patterns:
            - '\b(?:Set-Content|Add-Content|Out-File|Export-Csv|Export-Clixml|Set-ItemProperty|Set-Service)\b'
            - '\b(?:Remove|Copy|Move|Rename|New)-Item\b'
            - '\bInvoke-RestMethod\b[^\n]*-Method\s+(?:Post|Put|Patch|Delete)\b'
            - '(?<![0-9&\\])>>?\s*["'']?[~./$\w]'
          guard_inline_patterns: []
          # Только на ПОСЛЕДНЕЙ ступени конвейера чтения: в инциденте
          # 2026-09-08 упал ConvertFrom-Json ниже по конвейеру, а флаг висел бы
          # на Get-Content — оправдание зеленило бы собственный повод.
          guard_inline_last_stage_patterns:
            - '-ErrorAction\s+["'']?Stop'
          guard_between_patterns:
            - 'if\s*\(\s*(?:-not|!)\s*<VAR>\s*\)'
            - 'if\s*\(\s*\$null\s+-eq\s+<VAR>\s*\)'
            - 'if\s*\(\s*<VAR>\s+-eq\s+\$null\s*\)'
            - 'if\s*\(\s*-not\s+\$\?\s*\)'
            - '^\s*\}\s*catch\b'
          guard_block_patterns:
            - '\$ErrorActionPreference\s*=\s*["'']?Stop'
            - '^\s*try\s*\{'
          guard_block_masked_patterns: []
          var_reference: '<VAR>\b'
          # PowerShell регистронезависим по определению языка: без флага
          # `set-content` молчал бы, а `if (-Not $j)` не оправдывал бы.
          ignorecase: true

  # ВНИМАНИЕ, слепое пятно калибровки. У чекера пять ног, а `run.calibrate`
  # ставит [ok] по условию «≥1 находка СВОЕГО имени на своей red-фикстуре».
  # Ноги 1-4 дают на ней десять находок, поэтому смерть любой одной ноги —
  # и ноги 5 в том числе — печатает ровно ту же строку
  # `калибровка: claim_provenance red=12 green=0 [ok]`: ни красного, ни строки
  # «не измерено», ни кода выхода. Единственный сторож — разложение по
  # префиксу формы в `tests/test_claim_scope.py::test_previous_legs_did_not_drop`
  # (8 без префикса / 2 [count_predicate_unmeasured] / 2 [date_literal_unmeasured]).
  # Заводя шестую ногу, правь этот тест, а не только счёт: калибровка о ней
  # промолчит.
  # Переименован из stop_provenance 2026-08-31: расширение записано структурной
  # мерой в §A реестра правок канона (К1, рецидивы 3 и 4 правила провенанса),
  # механики на тот момент не было. Прежняя нога — числа в стоп-условиях —
  # сохранена дословно: расширение не вправе переопределять закрытый долг §B.
  - name: claim_provenance
    module: linter.checkers.claim_provenance
    kinds: [handoff]
    rule_id: R-PROV-001
    scenario: S-02
    description: >-
      Числовой литерал в блоке стоп-условия, числовая оценка в утверждении
      оркестратора либо адрес пункта канона — без соседнего провенанса.
    config:
      block_markers:
        - 'стоп-услов'
        - 'стоп услов'
        - 'не должно двигаться'
        - 'должно совпасть'
        - 'stop[- ]condition'
      block_max_lines: 20
      provenance_window: 1
      ignore_patterns:
        - '§\s*\d+(\.\d+)*'
        - '\b\d{4}-\d{2}-\d{2}\b'
        - '\b(ADR|PDR|EMV-DL|S|К|L)-?\d+\b'
        - '\bv\d+(\.\d+)*\b'
      command_pattern: '`[^`]*\b(git|gh|wc|grep|rg|sed|awk|jq|curl|ls|cat|find|gcloud|adb|docker|kubectl|python3?|pip|test)\b[^`]*`'
      awaiting_pattern: '(ожидан|ожидается|не проверено|не измерено|оценк|прогноз|предполож)'
      output_pattern: '(выдач|вывод|измерено|провенанс|из выдачи|вернул|отдал|показал)'
      # ── ноги 2 и 3 (расширение 2026-08-31). Меряют прозу хода, не блок.
      # Строки, разобранные первой ногой, второй раз не судятся.
      claim_window: 1
      estimate_patterns:
        - '(?:примерно|приблизительно|около|порядка|~)\s*\d+'
        - '\b\d+(?:\s*[–—-]\s*\d+)?\s+(?:\S+\s+){0,2}?в\s+(?:неделю|день|сутки|месяц|год|ход|прогон|milestone)\b'
        - '\b\d+\s+из\s+\d+\b'
      # Адрес пункта канона: § раздела, путь внутри вольта (префиксы те же, что
      # canon_paths в config.yaml), «файл.md:строка», «строка N».
      canon_ref_patterns:
        - '§\s*\d+(?:\.\d+)*'
        - '\b(?:00-system|01-theygrow|02-synthesis|03-library|04-decisions|05-inbox)/[\w./-]+'
        - '\b[\w.-]+\.md:\d+'
        - '\b(?:строк\w+|line)\s+\d+\b'
      read_pattern: '(прочитан|читан|чтени|из выдачи|выдач|вывод|измерен|провенанс|вернул|отдал|показал|по месту|сверен|свеж\w+ чтени)'
      # «Оценка» в этот список не входит намеренно: рецидив 3 состоял ровно в
      # том, что оценка была названа оценкой и тут же процитирована как
      # основание. Этим список отличается от awaiting_pattern первой ноги.
      claim_unverified_pattern: '(не\s+проверено|не\s+измерено|не\s+измеряли|не\s+сверял\w*|не\s+читал\w*|прогноз|гипотез\w*|предполож\w*|не\s+измерение)'
      # ── нога 4 (пакет B-P2b-P2, 2026-09-10). Счётное утверждение: квантор
      # исчерпанности, УПРАВЛЯЮЩИЙ счётным существительным инвентаря полосы.
      #
      # Числительных в квантoрах нет намеренно. Счёт — предмет ног 1 и 2, и
      # второе правило того же смысла не заводится. Цена названа, а не скрыта:
      # голый счётчик («17 чекеров») сегодня не ловит ни одна нога. Измерено на
      # фикстурах: с числительными нога даёт 2 находки на green-корпусе
      # (green/artifact_integrity.md «пяти чекерам», green/smoke_line.md «ровно
      # одна строка») — то есть красит гейт `linter-fast-green`; закрытие
      # пробела стоило бы правки двух чужих green-фикстур и идёт отдельно.
      count_quantifier_patterns:
        - 'все[хм]?'
        - 'ни\s+одного'
        - 'ни\s+одной'
        - 'ни\s+один'
        - 'ни\s+одна'
        - 'единственн\w+'
        - 'полностью'
        - 'целиком'
      # Счётный инвентарь полосы — то, что перечисляется командой. «Откат» в
      # списке не стоит: список есть данные, и это меряется тестом
      # (test_noun_list_is_data).
      countable_nouns:
        - 'чекер\w*'
        - 'сценари\w*'
        - 'тест\w*'
        - 'фикстур\w*'
        - 'находк\w*'
        - 'форм\w*'
        - 'правил\w*'
        - 'коммит\w*'
        - 'пут(?:ь|и|ей|ям|ями)'
        - 'строк\w*'
        - 'файл\w*'
        - 'канал\w*'
        - 'пункт\w*'
        - 'детектор\w*'
        - 'прогон\w*'
        - 'артефакт\w*'
        - 'ход\w*'
        - 'блок\w*'
        - 'отч[ёе]т\w*'
        - 'запис(?:ь|и|ей)'
      # Мера соседства — управление (порядок + число слов), а не окно в
      # символах. Окно в 40 символов даёт 2 находки на green-корпусе на
      # дистрибутивном «каждая предпосылка измеряется строкой выше»;
      # управление — ноль. Мутация M1 красит tests/test_cli.py.
      count_gap_words: 1
      irrealis_pattern: '(?:^|\s)бы(?:\s|,|$)'
      hypothetical_frame_pattern: '(?:^|\s)(?:Дано|Действие|Ожидаемо\w*|Ожидание)\s*:'
      # Узкая пометка предсказания. «Оценки» здесь нет по той же причине, что и
      # в claim_unverified_pattern выше (рецидив 3).
      prediction_pattern: '(ожидан\w*|ожидаемо\w*|предсказан\w*|предсказ\w*|прогноз)'
      # ── нога 5 (пакет B-P2b-P2b, 2026-09-10). Литерал сегодняшней даты:
      # дейксис сегодняшнего дня, УПРАВЛЯЮЩИЙ литералом даты.
      #
      # Повод — контракт §11, расширение 2026-08-25 («перечень выше читается как
      # класс… а равно сегодняшняя дата»; «дата сессии — из окружения, а не из
      # хвоста лога»). Рецидив — реестр §B, правило «Дата — из среды…», К5,
      # счёт 1 (2026-09-05). Роль формы названа прямо: это гард против рецидива
      # с одним материальным прецедентом, а не частый детектор. Экспозиция на
      # калибровочном наборе (26 ходов) — НОЛЬ находок; на spec-корпусе
      # (~/.claude/plans, 55 файлов ≈ 17 000 строк) — ноль. Поэтому вид остаётся
      # [handoff]: он измерен, а не унаследован.
      #
      # Триггером служит дейксис, а не литерал. Голая дата в имени файла либо в
      # идентификаторе записи — ДОПУСТИМОЕ попадание (контракт: имена,
      # создаваемые самим ходом; CLAUDE.md п. 8а: цитирование чужих дат как дат
      # акта), и варианты D2-D4 пакета P2 встали именно на том, что держали его
      # внутри триггера.
      date_deixis_patterns:
        - 'сегодняшн\w*(?:\s+дат\w*)?'
        - 'сегодня'
        - 'дат[аеы]\s+(?:этого|настоящего)\s+хода'
        - "today'?s?(?:\\s+date)?"
        - 'the\s+date\s+of\s+this\s+turn'
      date_literal_pattern: '\b20\d{2}-\d{2}-\d{2}\b'
      # Оправдание — ПОЛОЖИТЕЛЬНЫЙ список: годится только то, что здесь стоит.
      # «Хвост лога» не входит намеренно — расширение контракта исключает этот
      # канал дословно. `SOURCE_DATE_EPOCH` и `--format=%ct` взяты по ADR-054
      # (12), NB-46: дата берётся вызовом из провенансного источника. Прозаическое
      # называние канала («по среде», «из среды») оправдывает: п. 8а требует
      # назвать дату из среды именно В ПРОЗЕ ХОДА, и 16 из 20 сырых попаданий
      # корпуса — это соглашение полосы, а не отказ. Цена названа: ход может
      # оправдаться, напечатав слова. Нога меряет соседство провенанса, а не его
      # истинность — та же граница, что у ног 1-3 (S-02).
      date_source_patterns:
        # окружение, названное в прозе хода
        - 'по\s+сред[еы]'
        - 'из\s+сред[ыи]'
        - 'сред[ыи]\s+сесси\w*'
        - 'from\s+the\s+environment'
        # команда, снявшая дату
        - '`[^`]*\bdate\b[^`]*`'
        - '\bdate\s+-u\b'
        - '\+%F\b'
        - '%Y-%m-%d'
        - '\bstat\s+-c'
        - 'git\s+log[^\n]*--date='
        - '--format=%c[td]'
        - 'SOURCE_DATE_EPOCH'
        # значение, продиктованное владельцем в этом же ходе
        - 'продиктован\w*'
        - 'владелец\s+назв\w*'
        - 'по\s+слову\s+владельца'
        - 'назван\w*\s+владельцем'
      # Мера соседства — управление, как у ноги 4, а не окно в символах.
      # Измерено на калибровочном наборе: совпадение по строке даёт 4 находки и
      # ни одной настоящей (дейксис управляет не датой; либо литерал назван как
      # ДРУГОЙ член пары — «случай 2026-08-30 и сегодняшний»); управление даёт 0.
      # Значение 3, а не 2: зачин полосы «Сегодня по среде УЖЕ <дата>» несёт три
      # промежуточных слова, и на двойке он не сработал бы вовсе — оправдание
      # стояло бы мёртвым слотом. Находок 0 при любом значении от 2 до 6, то
      # есть порог меняет не счёт, а то, проверяется ли оправдание. Цена
      # названа: дейксис дальше трёх слов от литерала не судится (M-D2).
      date_gap_words: 3

  # Пакет B-P2b-P2 (2026-09-10). Отдельный чекер, а не четвёртая нога
  # claim_provenance, и это разбор, а не вкус:
  #   1. Полярность оправдания обратная. claim_provenance при виде команды рядом
  #      делает `continue`; этот чекер обязан краснеть ровно там. Две
  #      противоположные меры в одной функции читались бы как одна.
  #   2. Калибровка идёт по чекеру, а не по форме: red-фикстура
  #      claim_provenance и так даёт 8 находок, и умершая форма внутри неё
  #      осталась бы невидимой. У формы, чья экспозиция на живом корпусе ноль,
  #      строка калибровки — единственный живой сигнал.
  #   3. Прецедент: unguarded_state_write отделён от shell_mech тем же разбором.
  #
  # `scenario` НЕ ЗАДАН намеренно. S-02 держит claim_provenance и перечисляет
  # свои формы закрытым списком («несёт одно из трёх»); этот класс в нём не
  # описан, а scenarios/ — ярус 2, подпись владельца. Названная цена, не
  # молчаливый пробел: черновик сценария уходит владельцу пакетом P3 вместе с
  # S-23 для unguarded_state_write.
  #
  # Экспозиция на калибровочном наборе — ноль, и это «не измерено», а не
  # «чисто»: оба артефакта набора датированы 2026-08-31, до того как полоса
  # завела свой git-обиход. Истинно-положительное свидетельство — свежий повод
  # (9 путей / 356 строк против 14 / 1205) и red-фикстура, не архив.
  # Вид артефакта измерен, а не выведен из правила (пакет B-P2b-P2, коррекция
  # владельца): чекер прогнан по настоящему spec-корпусу на диске — планы
  # пакетов P1 и P2 под ~/.claude/plans/ — и дал 7 находок на 1000 строк, все в
  # плане P2. Поэтому `kinds` расширен до spec, а не оставлен на handoff по
  # аналогии с claim_provenance.
  #
  # Чем оказались эти 7: все до одной — цитаты словаря самого чекера (класс
  # отказа, повод, таблица различения, текст фикстур). Это класс `self_reference`
  # из config.yaml: «находка на строке, которая не поручает и не утверждает, а
  # цитирует словарь самого чекера… Порогом такое не чинится: сузить триггер под
  # цитату — значит сузить его под настоящие поручения той же формы». Сужения
  # поэтому нет; счёт назван.
  - name: repo_state_claim
    module: linter.checkers.repo_state_claim
    kinds: [handoff, spec]
    rule_id: R-PROV-001
    description: >-
      Утверждение о составе или чистоте рабочего дерева опирается на команду,
      область которой уже области утверждения. Провенанс соблюдён — и потому
      отказ не виден: счётчик отвечает на свой вопрос верно, а утверждение
      задаёт другой.
    config:
      # Область утверждения — положительный список, а не изъятие. Утверждение,
      # чей предмет И ЕСТЬ дифф («В diff 4 файла — выдача `git diff --stat`»),
      # сюда не входит и молчит по построению: там область команды равна
      # области утверждения. Мутация M4 (снять различение областей) красит
      # tests/test_cli.py на green/claim_provenance.md — измерено: 0 против 1.
      claim_scopes:
        worktree: '(?:состав\w*\s+(?:правк\w+|пакет\w+|изменени\w+)|рабоч\w+\s+дерев\w+|working\s+tree|незакоммич\w+)'
        commit: '(?:состав\w*\s+коммит\w*|коммит\s+нес[ёе]т)'
      # Границы слова обязательны у каждого предиката. Без `\b` `пуст\w+`
      # ловит «проПУСТили» — измерено на калибровочном наборе (session-2.md:740,
      # предсказано 0 находок, наблюдено 1 по этому токену).
      counted_pattern: '(?:\d+\s*(?:файл\w*|пут(?:ь|и|ей|ям)|строк\w*)|(?:файл\w*|пут(?:ь|и|ей)|строк\w*)\s*[—:-]\s*\d+|\bвс[её]\b|\bцеликом\b|\bполностью\b|\bчист\w+|\bпуст\w+)'
      # Узкие команды. Поле `blind` — не украшение сообщения: оно называет, чего
      # команда не видит, и без него находка была бы запретом на инструмент
      # вместо разбора области.
      narrow_commands:
        - pattern: 'git\s+diff(?![^`\n]*--cached)(?![^`\n]*--staged)'
          blind: '`git diff` не видит неотслеживаемых файлов'
        - pattern: '\|\s*head\s+-\d+'
          blind: 'вывод обрезан `head`'
        - pattern: '\|\s*tail\s+-\d+'
          blind: 'вывод обрезан `tail`'
        - pattern: 'git\s+log[^`\n]*\s-(?:n\s*)?\d+\b'
          blind: 'окно журнала ограничено числом строк'
        - pattern: '\bls(?![^`\n]*-[A-Za-z]*R)\b'
          blind: '`ls` не рекурсивен'
        - pattern: '-maxdepth\s*1\b'
          blind: 'обход ограничен глубиной 1'
      covering_commands:
        # `git add -A && git diff --cached` в списке НЕ стоит: он недостижим —
        # отрицательный просмотр `(?!...--cached)` в узком шаблоне снимает
        # узость раньше, чем дело доходит до покрытия. Мутация M5 на нём не
        # краснела, и слот был мёртвым; мёртвое из данных убрано, а не оставлено
        # выглядеть живым.
        worktree: '(?:git\s+status\s+--porcelain|git\s+ls-files[^`\n]*--others)'
        commit: '(?:git\s+show[^`\n]*--stat|git\s+diff[^`\n]*--cached)'
      # Мера — усечение, а не конвейер: `git status --porcelain | wc -l` считает
      # всё и покрытия не теряет; `| head -20` теряет. Наивное «покрывающая, но
      # в трубе — не покрывающая» покрасило бы green/shell_mech.md:11.
      truncation_pattern: '\|\s*(?:head|tail)\s+-\d+'
      named_limit_pattern: '(?:без\s+уч[ёе]та\s+неотслеж\w*|только\s+отслеж\w*|untracked\s+не\s+вход\w*|предел\s+назван)'
      # Пункт списка с инфинитивом адресован владельцу и притязания не делает.
      instruction_pattern: '^\s*(?:[-*+]|\d+[.)])\s*\*{0,2}[А-ЯЁA-Za-zа-яё]+(?:ть|ти|чь)\b'
      # Адрес пункта канона — предмет ноги 3 claim_provenance; один отказ не
      # называется дважды.
      foreign_ref_patterns:
        - '§\s*\d+(?:\.\d+)*'
        - '\b[\w.-]+\.md:\d+'
        - '\b(?:строк\w+|line)\s+\d+\b'
      command_window: 2
      block_reach: 8

  - name: env_presupposition
    module: linter.checkers.env_presupposition
    kinds: [handoff]
    rule_id: R-SHELL-003
    scenario: S-03
    description: >-
      Предпосылочная форма без предшествующей измеряющей строки.
      Список форм — данные: расширяется здесь, без правки модуля.
    config:
      # Область по языку ограды расширена 2026-09-10 (пакет B-P2b-P1): формы
      # `curl_follow_hides_redirect` и `reinstall_without_pins.*` меряют команды,
      # которые владелец получает и в PowerShell-блоке. Ключ действует только на
      # этот чекер (run.load_checkers: собственный config побеждает `shared`);
      # общий список не трогается — его расширение молча СУЖАЕТ два чекера дома
      # промптов (linter/prompts.py снимает блок, чей язык лежит в shell_langs)
      # и даёт `shell_mech.windows_path` ложный красный на пути `D:\…`, который
      # в PowerShell верен. Измерено: по 32 фикстурам дельта 0; на PowerShell-
      # блоке с `gcloud`/`adb`/`git push`/`gh auth` четыре действующие формы
      # срабатывают — и это верно, двоичные файлы те же в обеих оболочках.
      # `long_heredoc` в PowerShell инертен: here-string пишется `@" … "@`.
      shell_langs_extra: [powershell, pwsh, ps1]
      forms:
        - name: pip_install_outside_venv
          kind: line_pattern
          scope: document          # форма ловится и вне shell-блока: инструкция
                                   # владельцу в прозе исполняется так же буквально
          pattern: '\bpip3?\s+install\b'
          absolved_by_line: '(\.venv/bin/pip|/venv/bin/pip|\bvenv/bin/pip|python3?\s+-m\s+venv|--python\s+\S*venv)'
          absolved_by_above: '(python3?\s+-m\s+venv|source\s+\S*venv/bin/activate|\.\s+\S*venv/bin/activate|VIRTUAL_ENV=)'
          # scope: document — «выше» ограничено окном, иначе один venv в начале
          # документа оправдывает любую установку до конца файла
          above_window: 3
          message: >-
            `pip install` без venv-пути и без предшествующей строки, создающей или
            активирующей venv: в среде PEP 668 системный pip отказывает
            (externally-managed-environment) — блок падает на предпосылке, а не на предмете
        - name: gcloud_run_named_service
          kind: line_pattern
          scope: shell_block
          pattern: '\bgcloud\s+run\s+(deploy|revisions|services\s+(update|describe|delete|update-traffic))\b'
          absolved_by_above: '\bgcloud\s+run\s+services\s+list\b'
          message: >-
            `gcloud run …` с именем сервиса без предшествующего `gcloud run services list`:
            имя взято по памяти, провал блока неотличим от отсутствия предмета
        - name: adb_serial_without_devices
          kind: line_pattern
          scope: shell_block
          pattern: '\badb\s+-s\s+\S+'
          absolved_by_above: '\badb\s+devices\b'
          message: >-
            `adb -s <серийник>` без предшествующего `adb devices`:
            серийник назван по памяти, подключение не измерено
        # Формы 2026-09-04 (реестр §B, «Исполнимость shell-блока», рецидивы
        # 2026-09-03/04, счёт 5, 4, 5; лечение — расширение механики,
        # owner-акт 2026-09-04, пункт 1=да).
        - name: push_workflow_without_scope
          kind: line_pattern
          scope: shell_block
          pattern: '\bgit\s+push\b'
          # Условие: выше по блоку файл workflow отправлен в индекс. Без него
          # `git push` о праве `workflow` ничего не предполагает.
          requires_above: '\.github/workflows/'
          absolved_by_above: '\bgh\s+auth\s+status\b'
          message: >-
            `git push` при staged-файле под `.github/workflows/` без предшествующего
            `gh auth status`: право `workflow` у токена не измерено — удалённая
            сторона отклоняет такой push отдельной ошибкой, и провал блока читается
            как отказ предмета, а не как нехватка права
        - name: gh_auth_without_status
          kind: line_pattern
          scope: shell_block
          pattern: '\bgh\s+auth\s+(?:refresh|login)\b'
          absolved_by_above: '\bgh\s+auth\s+status\b'
          message: >-
            `gh auth refresh|login` без предшествующего `gh auth status`: текущий
            набор прав не измерен, и добавляемое право неотличимо от уже имевшегося —
            выдача команды выглядит одинаково в обоих случаях
        - name: long_heredoc
          kind: heredoc_length
          scope: shell_block
          max_lines: 25
          message: >-
            heredoc длиннее {max_lines} строк: предпосылка о том, что канал доставки
            переживёт вставку такой длины, не измерена

        # ── Формы 2026-09-10 (пакет B-P2b-P1; ADR-054, аннотация 2026-09-09,
        # NB-45 и NB-44). Обе стоят `scope: shell_block`, а не `document`, и
        # выбор измерен, а не предпочтён: на калибровочном артефакте владельца
        # (05-inbox/archive/altrego-calibration-2026-08-31-09-01/session-2.md)
        # `document` давал +11 находок, из них НОЛЬ внутри блока — все они ход,
        # который об установке ГОВОРИТ, а не поручает её. Сужение по признаку
        # (блок), а не по частоте; признак совпадает с рамкой пакета.
        # Соседняя `pip_install_outside_venv` остаётся `document` — её основание
        # («инструкция в прозе исполняется так же буквально») не отменяется,
        # прозаический канал у полосы не исчезает, он просто не умножается.

        - name: curl_follow_hides_redirect
          kind: line_pattern
          scope: shell_block
          # Якорь на `curl` в той же команде; разрыв не переходит `|`, `;`, `&` —
          # иначе `-L` чужой команды (`gh run list -L 1`, `grep -L`) дал бы
          # ложное срабатывание (измерено). Токен флага обязан кончаться
          # пробелом или концом строки: так отсекается `report-LOG.txt`.
          # Регистр значим: `-L` и `-l` у curl — разные флаги.
          pattern: '\bcurl\b[^|;&\n]*?(?:\s--location(?:-trusted)?\b|\s-[A-Za-z]*L[A-Za-z]*(?=\s|$))'
          # Оправдывает ПОЛЕ формата, а не флаг `-w`: `%{http_code}` не называет
          # ничего. `--max-redirs 0` (и форма через `=`) оправдывает не тем, что
          # ограничивает, а тем, что делает неназванное приземление невозможным:
          # curl отказывает на первом же 3xx, то есть восстановлено умолчание,
          # которое NB-45 называет образцом fail-closed. При N >= 1 не
          # оправдывает: `--max-redirs` отвечает только на третью из трёх gotcha
          # (петля), а «куда я пришёл» и «что туда ушло» называет только
          # конечный адрес. Расширить оправдание до любого N значило бы сменить
          # инвариант ветки с «адрес назван» на «цепь ограничена».
          # Оправдания строкой ВЫШЕ нет намеренно: зонд выше меряет ДРУГОЙ
          # запрос — редирект не обязан совпасть у HEAD и у POST.
          absolved_by_line: '(%\{url_effective\}|--max-redirs[=\s]+0(?![0-9]))'
          message: >-
            `curl -L` без `%{url_effective}` на той же команде: конечный адрес
            назначает ответ сервера, нигде не печатается и в вердикт не входит —
            байты неизвестного происхождения при коде выхода 0; на 301/302/303 POST
            молча превращается в GET, и запись, которой не было, читается как
            сделанная. Лечение curl-специфично: в Windows PowerShell 5.1 `curl` —
            алиас `Invoke-WebRequest`, у которого нет ни `-L`, ни `%{url_effective}`

        # Ветка `reinstall_without_pins` — одна по классу, несколько записей по
        # экосистемам: оправдания у них разные, и общая альтернация оправдывала
        # бы перекрёстно (пин образа снимал бы находку на пакете) и не могла бы
        # назвать нужную ступень в сообщении. Имя ветки несёт префикс, чтобы
        # счёт и мутации велись по ветке, а не по каждой записи.
        # Ступень лестницы NB-44 — вторая (точная редакция либо ссылка на
        # закоммиченный манифест). Верхняя (пин хэшем) чекеру недоступна: он
        # чистая функция и файлов не открывает; предел назван, а не опущен.
        - name: reinstall_without_pins.python
          kind: line_pattern
          scope: shell_block
          pattern: '(?:\bpip3?\s+install\b|\bpipx\s+install\b|\buv\s+pip\s+install\b|\buv\s+add\b)'
          # `-r`/`--requirement` и `-e`/`--editable` — НЕ пин, а выход из
          # предмета: состав файла линтер не читает, и красный здесь был бы
          # вердиктом о непрочитанном содержимом.
          absolved_by_line: '(==|@[0-9a-f]{40}(?![0-9a-f])|--require-hashes\b|(?<![\w-])-r(?![\w-])|--requirement\b|(?<![\w-])-e(?![\w-])|--editable\b)'
          message: >-
            установка называет пакет, но не редакцию: повтор того же блока ставит
            другое, и зелёный прошлого прогона о нынешней среде не говорит ничего.
            Пин — `==<версия>` либо `git+…@<sha>`; `-r <файл>` снимает вопрос,
            перенося его в закоммиченный манифест (ADR-054 NB-44)

        - name: reinstall_without_pins.node
          kind: line_pattern
          scope: shell_block
          # Шаблон требует имя пакета после глагола: голый `npm install` и
          # `npm ci` идут по lock-файлу и предметом не являются вовсе.
          pattern: '\b(?:npm\s+(?:install|i)|pnpm\s+add|yarn\s+add)\b(?:\s+-{1,2}[\w-]+)*\s+(?!-)[@A-Za-z][\w@/.-]*'
          # Диапазоны `^`/`~` не оправдывают: это нижняя ступень лестницы.
          absolved_by_line: '(@\d+\.\d+\.\d+(?![\w.])|#[0-9a-f]{7,40}\b)'
          message: >-
            пакет назван именем без точной редакции (диапазон `^`/`~` либо ничего) —
            повтор блока ставит другое. Пин `pkg@1.2.3` либо `#<sha>`; `npm ci`
            против lock-файла предметом не является (ADR-054 NB-44)

        - name: reinstall_without_pins.psmodule
          kind: line_pattern
          scope: shell_block
          # PowerShell регистронезависим: без `ignorecase` `install-module`
          # молчал бы, а `-requiredversion 5.6.1` не оправдывал бы. Правило,
          # кодирующее регистр имён оболочки, — правило про оболочку, а не про
          # класс отказа (реестр §D, 2026-09-08 (3), п. 3).
          ignorecase: true
          pattern: '\bInstall-(?:Module|Script|Package)\b'
          absolved_by_line: '-RequiredVersion\b'
          message: >-
            `Install-Module` без `-RequiredVersion`: галерея отдаёт последнюю, и
            повтор блока ставит другое. Тот же класс, что установка без `==`;
            форма пина зависит от оболочки, класс — нет

        - name: reinstall_without_pins.winget
          kind: line_pattern
          scope: shell_block
          ignorecase: true
          pattern: '\b(?:winget|choco|scoop)\s+install\b'
          absolved_by_line: '(--version[=\s]\S|(?<![\w-])-v\s+\S)'
          message: >-
            пакет из каталога Windows без `--version`: ставится текущая редакция
            каталога, и повтор блока ставит другое

  - name: grep_vacuum
    module: linter.checkers.grep_vacuum
    kinds: [handoff, spec]
    rule_id: R-SMOKE-004
    scenario: S-04
    description: >-
      Поиск, чей нулевой результат неотличим от отсутствия предмета.
    config:
      search_pattern: '(?<![\w-])(?:git\s+)?(?:grep|rg|ugrep)\b'
      absolved_same_line: '(\|\|\s*(echo|printf)|(?:grep|ugrep)\s+(-\w*c\w*|--count)\b|\brg\s+(-\w*c\w*|--count|--count-matches)\b)'
      absolved_in_block: '(test\s+-s\b|\[\s+-s\s|\[\[\s+-s\s|\bwc\s+-l\b|--count-matches\b)'
      marker_lookahead: 1

  - name: turn_end
    module: linter.checkers.turn_end
    kinds: [handoff]
    rule_id: R-TURN-005
    scenario: S-05
    description: >-
      Строка «Конец хода» отсутствует либо не называет требуемое слово владельца;
      с 2026-09-07 (v2) — плюс развилка владельцу без слота трёх полей, «есть»
      без «потому что» и конец хода на анонсе собственного действия.
      Структурная половина S-05; существо — manual.
    config:
      marker_pattern: '^\s*(?:[*_#>\-\s]*)\**\s*Конец хода\**\s*(?::|—|-)?\s*(.*)$'
      min_significant_chars: 10
      require_presence: true

      # ── Расширение 2026-09-07: контракт §11, «Слот трёх полей перед вопросом
      # владельцу»; реестр правок канона §B, счёт пары «Конец хода» × К4 —
      # №4, №5, №7. Оракул назван самим подабзацем в поле *Проверка*, и три
      # ветки ниже — ровно он, без четвёртой: «вопрос владельцу при трёх «нет»»
      # в *Проверку* не вошёл и остаётся за владельцем.
      #
      # Огороженные блоки снимаются до всех проверок — «Допустимое попадание»
      # подабзаца: «варианты внутри блока владельца, а не вопрос ему». Признак
      # ограды не заводится здесь: чекер берёт общий дом common.in_block_lines,
      # шестая копия признака разошлась бы с пятью имеющимися молча.

      # (а) Инвариант: маркер НАЗЫВАЕТ ОДИН ПРЕДЛОЖЕННЫЙ ВАРИАНТ; два и более
      # названных варианта = развилка, вынесенная владельцу. Группа 1 каждого
      # регэкспа — тождество варианта, и считаются РАЗЛИЧНЫЕ тождества: «А)» и
      # «вариант А» — один вариант, «вариант А» дважды — тоже один. Счёт по
      # совпадениям краснел бы на повторе; по строкам — терял бы однострочную
      # развилку «основной вариант и близкая альтернатива»; по регэкспам —
      # терял бы собственную подпись владельца «1=»/«2=» на двух строках.
      variant_min: 2
      variant_markers:
        # 1= · 2 = · **1=** · - 2=  (форма подписи владельца)
        - '^[\s>*_#|-]*\**\s*(\d+)\s*='
        # А) Б) В) в начале строки
        - '^[\s>*_#|-]*\**\s*(?-i:([АБВ]))\s*\)'
        # «вариант А», «варианта Б». Буква — только прописная: под IGNORECASE
        # «вариант в редакции пакета» дало бы предлог «в» меткой варианта.
        # \b слева отсекает «инвариант» (30 вхождений в этом репозитории).
        - '\bвариант\w*[ \t]+(?-i:([АБВ]))(?!\w)'
        # «основной вариант» — форма прямо называет один вариант главным среди
        # предложенных. На 637 файлах вольта 2 совпадения, оба — записи этого
        # самого рецидива.
        - '\b(основн)\w*\s+вариант\w*'
      # Называют вариант ТОЛЬКО относительно уже названного первого: считаются,
      # если сработал хоть один variant_markers. «альтернатива» сама по себе
      # называет отношение сравнения, а не вынесенный владельцу вариант — на
      # вольте 262 вхождения в 131 файле, самостоятельным маркером красит 51
      # файл из 56. Сужение по признаку (зависимость), а не по частоте.
      variant_markers_paired:
        - '\b(альтернатив)\w*'
      # Ищутся в любом месте текста. Канон требует строку слота ПЕРЕД вопросом;
      # послабление названо владельцем в задании пакета и стоит наблюдением в
      # докстринге чекера, а не выдаётся за проверку канона.
      slot_fields:
        - 'Периметр владельца'
        - 'Обратимость'
        - 'Долгосрочная разница'

      # (б) Значение поля берётся по имени поля, а не поиском слова «есть» по
      # строке: три поля слота стоят одной строкой через «·», и «есть» внутри
      # соседнего поля или свободной прозы полем не является. Значение кончается
      # на «·» либо на конце строки.
      #
      # Основание «потому что» ищется в том же значении (и в следующей непустой
      # строке), а не по всей строке — правка 2026-09-08. Инвариант подабзаца
      # говорит об основании ПОЛЯ: на канонной однострочной форме слота
      # основание соседнего поля иначе покрывает непокрытое «есть». Замерено на
      # настоящем документе: канон-реестр вольта, строка 138, где единственное
      # «потому что» строки — отрицающее упоминание оборота.
      difference_field_pattern: '(?:\*\*|__)?\s*Долгосрочная\s+разница\s*(?:\*\*|__)?\s*[:—–-]\s*([^·|\n]*)'
      difference_yes_pattern: '^\s*(?:\*\*|__)?\s*есть\b'
      because_pattern: 'потому\s+что'

      # (в) Ведущая разметка срезается до сравнения — несущее, а не косметика:
      # marker_pattern отдаёт в хвост закрывающие ** жирного, а в жирной форме
      # стоят все 29 строк «Конец хода» корпуса.
      announce_lead_strip: '^[\s>*_~`«»"''‘’\-‐‑‒–—―•·+#|]+'
      # Маркер сверяется с НАЧАЛОМ хвоста, а не ищется в нём: слово «дальше»
      # стоит внутри 3 из 24 настоящих закрывающих строк владельца и ни одна из
      # 24 с маркера не начинается. Список — перечислимая половина инварианта
      # («хвост называет собственное следующее действие хода»), и это названо
      # наблюдением в докстринге чекера.
      announce_markers:
        - 'следующим\s+шагом\b'
        - 'записываю\b'
        - 'далее\b'
        - 'дальше\b'
        - 'сейчас\s+сделаю\b'
        - 'приступаю\b'
        - 'продолжаю\b'

  - name: smoke_line
    module: linter.checkers.smoke_line
    kinds: [handoff]
    rule_id: R-SMOKE-004
    scenario: S-06
    description: >-
      Исполняемый блок, выданный владельцу, без названного рядом ожидания его
      вывода либо с ожиданием, не цитирующим фактический вывод на предмете.
      Списки форм и границы раздела — данные: расширяются здесь, без правки модуля.
    config:
      # Инвариант пункта, а не форма инцидента: прежний чекер искал слова
      # «строка смоука» — дословный пример из текста §11; в настоящих handoff
      # этих слов нет, и калибровка 20260831T154751Z дала по нему 0 находок.
      # Признак — блок в разделе «Ваши действия» плюс строка ожидания рядом.
      # Границы раздела те же, что у owner_action_block (§7 — общий дом обоих).
      section_pattern: '^[\s*_>#|-]*\**\s*Ваши\s+действия\b'
      section_end_pattern: '^[\s*_>#|-]*\**\s*Конец\s+хода\b'
      section_max_lines: 40
      # «рядом» = абзац-зачин блока плюс столько абзацев после закрывающей ограды
      expectation_paragraphs: 2
      expectation_patterns:
        - 'ожидаемо\s*[:—–-]'
        - 'ожидаем\w*\s+(вывод|выдач\w*)\s*[:—–-]'
        - 'ожидани[ея]\s*[:—–-]'
        - 'ожидаетс[яь]\s*[:—–-]'
      min_expectation_chars: 10
      # «Фактический вывод» — полученный исполнением на предмете. Ожидание,
      # написанное из головы («ожидаемый вывод — 1»), сюда не попадает намеренно.
      executed_patterns:
        - 'фактическ\w*\s+(вывод|выдач\w*)'
        - '(вывод|выдач\w*)\s+на\s+предмете'
        - 'исполнен\w*\s+на\s+(текущем\s+)?предмете'
        - 'прогнан\w*\s+на\s+предмете'
        - 'вывод\s+прогона'
      not_executed_patterns:
        - 'не\s+исполнял\w*'

  - name: live_channel_slot
    module: linter.checkers.live_channel_slot
    kinds: [handoff]
    rule_id: R-LIVE-002
    scenario: S-01
    description: >-
      Утверждение о состоянии живого канала без слота «Каналы: X, Y» либо со
      слотом на одном источнике. Структурная мера реестра §A, 2026-08-31, К2:
      переводит S-01 из manual в deterministic.
    config:
      # Инвариант пункта: утверждение о текущем состоянии внешнего изменяемого
      # носителя. Признак — глагол состояния/результата при существительном-
      # носителе, оба в одной строке и не дальше pair_window символов друг от
      # друга. Оба списка — данные: новая форма есть правка манифеста, не кода.
      carrier_nouns:
        - '\bстраниц\w*'
        - '\bсайт\w*'
        - '\bрепозитори\w*'
        - '\bветк\w*'
        - '\bрелиз\w*'
        - '\bпакет\w*'
        - '\bсервис\w*'
        - '\bаккаунт\w*'
        - '\bкоммит\w*'
        - '\bмагазин\w*'
        - '\bиндекс\w*'
        # Дополнение 2026-08-31 — решение оркестратора, не подгонка под корпус.
        # Носители полосы «Система» отсутствовали в списке, хотя утверждения о
        # них — «клон обновлён», «прогон прошёл», «отчёт создан» — ровно те же
        # утверждения о состоянии внешнего изменяемого носителя, что и
        # «страница опубликована»: они читаются владельцем как измеренные и
        # ровно так же строятся на одном чтении. Валидация — на артефакте
        # session-2.md калибровочного набора 2026-08-31 (вольт,
        # 05-inbox/archive/altrego-calibration-2026-08-31-09-01/, адресуется
        # через ALTREGO_VAULT_MASTER); session.md того же набора для
        # подтверждения правок чекеров израсходован (см. README.md набора).
        # «пакет» в списке уже стоял — повторно не заводится.
        - '\bвольт\w*'
        - '\bклон\w*'
        - '\bканон\w*'
        - '\bреестр\w*'
        - '\bкорпус\w*'
        - '\bотч[ёе]т\w*'
        - '\bпрогон\w*'
      # Только предикативные (краткие) формы: «страница опубликована» —
      # утверждение, «после зелёного прогона» — определение при существительном.
      state_verbs:
        - '\bсоздан(?:а|о|ы)?\b'
        - '\bопубликован(?:а|о|ы)?\b'
        - '\bпро(?:шёл|шел|шла|шло|шли)\b'
        - '\bдоступ(?:ен|на|но|ны)\b'
        - '\bвид(?:ен|на|но|ны)\b'
        - '\bсто(?:ит|ят)\b'
        - '\bобновл(?:ён|ен|ена|ено|ены)\b'
        - '\bдоехал[оаи]?\b'
        - '\bзанят[оаы]?\b'
        - '\bзел[ёе]н(?:ый|ая|ое|ые)\b'
      pair_window: 60
      # Вторая мера соседства (заведена 2026-08-31 вместе с дополнением
      # carrier_nouns): носитель и глагол, разделённые тире, точкой с запятой,
      # двоеточием или концом предложения, стоят в разных клаузах и парой не
      # являются. Одного окна в символах мало — 60 символов перешагивают тире.
      # Точка внутри числа («редакция 1.2 опубликована») границей не считается.
      clause_break_pattern: '[—–;:!?|]|\s-\s|\.(?:\s|$)'
      # Частный случай, сохранённый: дословные формулировки §11 «Утверждение о
      # живом канале — после второго канала» («доставлено», «не доехало»,
      # «у людей такая-то редакция») краснеют и без названного носителя.
      trigger_patterns:
        - 'доставлено'
        - 'не\s+доехало'
        - 'у\s+людей\b.{0,40}редакци'
      slot_pattern: '^[\s*_>#|-]*Каналы\s*\**\s*[:—–-]\s*(.+)$'
      source_split: ',|;|\sи\s'
      min_sources: 2
      min_source_chars: 3
      # слот ищется в той же секции и не дальше этого числа строк от утверждения
      slot_window: 6
      # «Допустимые попадания» пункта: ход с одним каналом, переписанный в
      # «требует подтверждения» либо несущий пометку «одно чтение, не
      # подтверждено», утверждения уже не делает.
      hedge_patterns:
        - 'одно\s+чтение,?\s*не\s+подтверждено'
        - 'требует\s+подтверждения'

  - name: owner_action_block
    module: linter.checkers.owner_action_block
    kinds: [handoff]
    rule_id: R-OWNERBLOCK-006
    scenario: S-08
    description: >-
      Пункт раздела «Ваши действия», поручающий исполнить команду, без
      огороженного блока в нём самом или в следующем пункте.
      Списки глаголов и границы раздела — данные: расширяются здесь, без
      правки модуля.
    config:
      section_pattern: '^[\s*_>#|-]*\**\s*Ваши\s+действия\b'
      # Раздел кончается на ближайшем из: markdown-заголовок, «Конец хода»,
      # следующий заголовок «Ваши действия», section_max_lines строк.
      section_end_pattern: '^[\s*_>#|-]*\**\s*Конец\s+хода\b'
      section_max_lines: 40
      item_pattern: '^\s*(?:\d+[.)]|[-*+•])\s+'
      # action_verbs — общий словарь из `shared` выше: его же читает
      # artifact_integrity. Собственной копии здесь нет намеренно.

  # ── Добор корпуса 2026-08-31: пять чекеров на пункты §11 с готовым оракулом
  # в поле «Проверка». Отбор из восьми детерминируемых кандидатов — по частоте
  # повода в §A/§B реестра правок канона (см. отчёт прогона и сценарии S-15…S-17,
  # оставленные manual с пометкой «кандидат в чекеры»).

  # ВНИМАНИЕ, слепое пятно калибровки. У чекера две формы, а `run.calibrate`
  # ставит [ok] по условию «≥1 находка СВОЕГО имени на своей red-фикстуре».
  # Старая форма даёт на red-фикстуре одну находку, новая — одну; смерть любой
  # из них печатает ту же строку `калибровка: detector_disposition red=1
  # green=0 [ok]`: ни красного, ни строки «не измерено», ни кода выхода.
  # Единственный сторож — разложение по префиксу формы в
  # tests/test_disposition_unit.py::test_both_forms_live_on_the_red_fixture
  # (1 без префикса / 1 [disposition_unit_unnamed]). Заводя третью форму, правь
  # этот тест, а не только счёт: калибровка о ней промолчит.
  #
  # ── форма disposition_unit_unnamed (пакет B-P2b-P3a, 2026-09-10).
  # Предсказанная диспозиция, названная ЧИСЛОМ без единицы измерения.
  #
  # Повод — 00-system/canon-corrections-register.md §A, 2026-08-31, класс К2:
  # «вилки заданы на один ход, прогон шёл по стенограмме двадцати; расхождение
  # ×3–5 выглядело дефектом детекторов, а было дефектом предсказания». Правка
  # §11 была там же вынесена «первым упражнением гейта этапа B» — это оно.
  #
  # Экспозиция измерена, единица названа в каждой строке: калибровочный набор —
  # 2 находки, единица «на артефакт», из 3 артефактов (session-2.md:821,
  # session.md:107); green-корпус — 0 на прогон по 18 фикстурам; spec-корпус
  # ~/.claude/plans, 55 файлов ≈ 17 000 строк — 0 на прогон. Роль формы, как
  # измерено, а не как сведено в счёт: обе находки набора — ОДНА форма блока
  # приёмки («называю предсказание до прогона» плюс перечень чекеров без
  # единицы), воспроизведённая в двух артефактах. Это регулярный отказ одной
  # формы в одном жанре хода, а не два независимых случая. Вид остаётся
  # [handoff]: ноль на spec-корпусе измерен, а не унаследован.
  #
  # Триггер — цифровая форма, и это признак, а не удобство. Русское
  # числительное словом обязательно управляет существительным и тем самым
  # называет свою совокупность («красный на четырёх местах публичной политики» —
  # строка 12 green-фикстуры, оставлена без правки и молчит по построению);
  # цифра не управляет ничем. Цена названа: предсказание, написанное словами
  # целиком, этой формой не судится.
  #
  # Умолчаний ключей формы в модуле НЕТ намеренно. Четыре списка полосы уже
  # мертвы механизмом «манифест побеждает умолчание» (DEFAULT_INTRO и
  # DEFAULT_SLOTS этого же чекера, DEFAULT_IGNORE и DEFAULT_COMMAND в
  # claim_provenance, DEFAULT_GATES в artifact_integrity — последний до сих пор
  # называет stop_provenance, переименованный 2026-08-31). Пятой мёртвой
  # стороны не заводится: ключ не задан — чекер поднимает исключение,
  # run_checker делает из него красный checker_error и «не измерено».
  - name: detector_disposition
    module: linter.checkers.detector_disposition
    kinds: [handoff]
    rule_id: R-DISPOSITION-012
    scenario: S-14
    description: >-
      Ход вводит новый детектор, не называя мутацию и обе диспозиции —
      предсказанную и наблюдённую; либо называет предсказанную диспозицию
      числом без единицы измерения.
    config:
      intro_patterns:
        - '\bнов\w+\s+(?:чекер\w*|гард\w*|детектор\w*|ног[ауи]\b)'
        - '\b(?:завожу|завед\w+|вношу|ввожу|вводит\w*)\s+(?:\w+\s+){0,2}?(?:чекер|гард|детектор)\w*'
        - '\b(?:чекер|гард|детектор)\w*\s+(?:завед\w+|введ\w+|добавл\w+)'
      slot_patterns:
        - name: мутация
          pattern: 'мутаци\w*'
        - name: предсказанная диспозиция
          pattern: 'предсказанн\w*\s+диспозиц\w*|диспозиц\w*\s*[:—–-]?\s*предсказ\w*|предсказ\w*\s+диспозиц\w*'
        - name: наблюдённая диспозиция
          pattern: 'наблюд[её]нн\w*\s+диспозиц\w*|диспозиц\w*\s*[:—–-]?\s*наблюд\w*|наблюд\w*\s+диспозиц\w*'
      # ── данные формы disposition_unit_unnamed ─────────────────────────
      # Слот адресуется ИМЕНЕМ из slot_patterns выше, а не второй копией
      # шаблона: копия разошлась бы с оригиналом молча. Имя, которого в списке
      # нет, — отказ чекера, а не тихий ноль (данные меряет
      # test_unit_slot_name_resolves_in_slot_patterns, рантайм —
      # test_an_unresolvable_slot_name_is_a_checker_error).
      unit_slot_name: предсказанная диспозиция
      # Количество — цифровая форма. Просмотры назад и вперёд отсекают адреса и
      # идентификаторы, а не стоп-список: 2026-08-31, §11, S-14, v0, B-P2b-P2,
      # `файл.md:8`, ×3–5 количеством не являются. Граница \d{1,3} держит вне
      # формы голый год; цена названа — предсказание в тысячу находок не судится.
      unit_quantity_pattern: '(?<![\w.,§×:\-–])\d{1,3}(?:\s*[–—−-]\s*\d{1,3})?(?![\w]|[.,\-–]\d)'
      # Маркер нумерованного пункта снимается до поиска количества: «2.» — номер
      # шага, а не число предсказания.
      unit_list_marker_pattern: '^\s*\d{1,3}[.)]\s'
      # Область предсказания кончается на ближайшем markdown-заголовке. Это
      # признак, а не порог: с границей диспозиция ОДИНАКОВА при unit_max_lines
      # 4, 8, 12, 20 и 40 — 2 на калибровочном наборе, 0 на green, 0 на red,
      # 0 на spec-корпусе при каждом значении. Число меняет не счёт, а то,
      # проверяется ли оправдание. Без границы окно 16 уже красит green-фикстуру,
      # дотянувшись до «код выхода 1» смоук-строки соседнего раздела.
      unit_section_end_pattern: '^\s{0,3}#{1,6}\s'
      unit_max_lines: 12
      # Указатель на предсказание — не предсказание. «Записать предсказанные
      # диспозиции (ниже)» отсылает к таблице, и таблица судится сама: это
      # единственный остаток на spec-корпусе (async-cray.md:133), а настоящая
      # таблица на строке 422 того же файла единицы называет и молчит. Гард
      # линейно-локальный, как irrealis у ног 4/5 claim_provenance. Цена
      # названа: «Предсказанная диспозиция ниже:» над блоком, не повторяющим
      # слот, — ложноотрицательное.
      unit_pointer_patterns:
        - '\bниже\b'
        - '\bвыше\b'
        - '\bрядом\b'
        - '\bсм\.'
        - '\bтаблиц\w*'
      # Единица — ЗАКРЫТЫЙ список: годится только то, что здесь стоит. Открытое
      # «на + любое существительное» приняло бы «на моих собственных ходах этой
      # сессии как на настоящих handoff-артефактах» (session-2.md:819) — ровно
      # ту совокупность, названную прозой, при которой инцидент К2 и произошёл.
      # Список шире трёх единиц канона намеренно: полоса пишет и остальные
      # («1 находка на блок», «на артефакт --fast» — план B-P2b-P1), а чекер
      # строже канона давал бы ложное срабатывание.
      unit_patterns:
        - 'на\s+(?:\d+\s+)?артефакт'
        - 'на\s+(?:\d+\s+)?ход'
        - 'на\s+(?:\d+\s+)?прогон'
        - 'на\s+(?:\d+\s+)?корпус'
        - 'на\s+(?:\d+\s+)?файл'
        - 'на\s+(?:\d+\s+)?фикстур'
        - 'на\s+(?:\d+\s+)?сценар'
        - 'на\s+(?:\d+\s+)?пакет'
        - 'на\s+(?:\d+\s+)?блок'
        - 'на\s+(?:\d+\s+)?строк'
        - 'на\s+(?:\d+\s+)?набор'
        - 'на\s+milestone'
        - 'за\s+прогон'
        - 'за\s+ход'
        - 'на\s+[«`"]\S+'
        - 'на\s+\S+\.md'
        - 'единиц\w*\s+измерен'

  - name: run_id_filter
    module: linter.checkers.run_id_filter
    kinds: [handoff, spec]
    rule_id: R-RUNID-008
    scenario: S-10
    description: >-
      «Последний прогон» отобран позицией (`--limit 1`, `head -1`, `.[0]`)
      без фильтра по событию и по sha.
    config:
      read_pattern: '\bgh\s+run\s+(?:list|view|download)\b'
      positional_patterns:
        - '(?:--limit|-L)\s+1\b'
        - '\|\s*head\s+(?:-n\s*)?-?1\b'
        - '\.\[0\]'
        - '\bfirst\b\s*\('
      # Пункт требует пары: событие без sha берёт чужой коммит, sha без события —
      # push-прогон того же коммита. Оправдывают только обе ноги вместе.
      event_pattern: '--event\b|--json[^|]*\bevent\b|\bevent\s*=='
      sha_pattern: '--commit\b|(?<!\w)-c\s+\S|\bheadSha\b|\bhead_sha\b'

  - name: download_dir
    module: linter.checkers.download_dir
    kinds: [handoff, spec]
    rule_id: R-DOWNLOAD-009
    scenario: S-11
    description: >-
      `gh run download` без `-D`/`--dir` либо с относительным путём: каталог
      назначения остаётся внутри рабочего дерева.
    config:
      download_pattern: '\bgh\s+(?:run|release)\s+download\b'
      dir_pattern: '(?:-D|--dir)[=\s]+(\S+)'
      # «Вне дерева» опознаётся по началу пути: линтер читает текст, не диск.
      outside_prefixes: ['^/', '^~', '^\$TMPDIR', '^\$\{TMPDIR', '^\$\(mktemp']

  - name: gh_repo_scope
    module: linter.checkers.gh_repo_scope
    kinds: [handoff, spec]
    rule_id: R-GHREPO-010
    scenario: S-12
    description: >-
      `gh` ниже по блоку после ухода в каталог-черновик — без `--repo`.
    config:
      # Дословные формы повода пункта: уход в /tmp и аналоги. `cd ~/repo` —
      # переход в другой репозиторий, а не выход из дерева, и не краснеет:
      # какой каталог является рабочим деревом, из текста хода не выводится.
      leave_patterns:
        - '(?:^|[;&|]\s*)cd\s+["'']?(/tmp|/var/tmp)\b'
        - '(?:^|[;&|]\s*)cd\s+["'']?\$\{?TMPDIR'
        - '(?:^|[;&|]\s*)cd\s+["'']?\$\(mktemp'
        - '(?:^|[;&|]\s*)cd\s+["'']?\.\.(?:/|\s|$)'
      gh_pattern: '(?<![\w-])gh\s+[a-z]'
      absolved_same_line: '--repo\b|(?<![\w-])-R\s+\S'
      absolved_in_block: '\bGH_REPO='

  - name: whitespace_diff
    module: linter.checkers.whitespace_diff
    kinds: [handoff, spec]
    rule_id: R-WHITESPACE-011
    scenario: S-13
    description: >-
      Счётчик правки (`--stat`/`--numstat`) в блоке без диффа с фильтром
      пробелов и без пометки «только о факте различия».
    config:
      counter_pattern: '\bgit\s+(?:diff|show|log)\b[^\n]*?(?:--stat|--numstat|--shortstat)\b'
      filter_pattern: '\bgit\s+diff\b[^\n]*?(?:(?<![\w-])-w\b|(?<![\w-])-b\b|--ignore-all-space|--ignore-space-change|--ignore-cr-at-eol)'
      # «Допустимые попадания» пункта — утверждение без притязания на содержание;
      # опознаётся пометкой в прозе вокруг блока, а не смыслом утверждения.
      hedge_patterns:
        - 'только\s+о\s+факте\s+различи'
        - 'без\s+притязани\w*\s+на\s+содержани'
        - 'отличаетс\w*\s+от\s+`?HEAD`?'
      hedge_window: 3

  # ── Дом промптов (2026-08-31). Оба правила стоят не в контракте, а в
  # prompt-kit, раздел «Правила использования»; их заведение потребовало
  # поднять разбор канона до bold_lead_v1 — оба пункта там элементы списка.
  # Признак копируемого промпта у обоих общий и живёт в `shared`.

  - name: prompt_self_assessment
    module: linter.checkers.prompt_self_assessment
    kinds: [handoff]
    rule_id: R-PROMPTKIT-019
    scenario: S-21
    description: >-
      Копируемый промпт другому агенту без списка критериев и числа самооценки
      0–100 рядом. Оракул взят из поля «Проверка» самого пункта.
    config:
      # prompt_min_lines и prompt_address_patterns — из `shared`.
      criteria_patterns:
        - 'критери\w*'
      # Число берётся со строки, несущей форму самооценки, и обязано лежать в
      # 0–100: «самооценка по 4 критериям» — счёт критериев, а не оценка.
      score_patterns:
        - 'самооценк\w*'
        - 'self[-\s]assessment'
      # Проза хода вокруг блока; строки любых оград исключены целиком —
      # самооценка адресована владельцу и в копируемый блок не уезжает.
      window: 15

  - name: sources_trailer
    module: linter.checkers.sources_trailer
    kinds: [handoff]
    rule_id: R-SOURCES-020
    scenario: S-22
    description: >-
      Копируемый промпт кодирует решение вольта (ADR/PDR/реестр/§ канона), но не
      несёт строки `Sources` со списком якорей.
    config:
      # Инвариант: ссылка на носитель вольта в любой форме. Прежний список
      # (ADR/PDR/реестр/§N) описывал форму того handoff, на котором чекер
      # заводился, и не видел решения, закодированного словами «несущий
      # документ §6», «контракт §11», «owner decision 2=а» (реестр §D,
      # 2026-08-31). § без имени канонического документа на строке не
      # триггерит: параграф сторонней бумаги решением вольта не является.
      vault_ref_patterns:
        - '\bADR[-\s]?\d+'
        - '\bPDR[-\s]?\d+'
        - '\bреестр\w*'
        - '§\s*[\dA-ZА-ЯЁ][^\n]{0,80}?\b(?:контракт|kit|кит|несущ|CLAUDE\.md|реестр)'
        - '\b(?:контракт|kit|кит|несущ\w+\s+документ|CLAUDE\.md)[^\n]{0,40}?§\s*[\dA-ZА-ЯЁ]'
        - '\bowner\s+decision\s+\d+\s*=\s*\S+'
        - '\bowner-акт\w*'
        - '\bрешени\w+\s+владельца\b'
        - '\b(?:решени|акт|owner)\w*[^\n]{0,40}\d{4}-\d{2}-\d{2}'
      # Packet-handoff: задача плана или реализации для репозитория. Правило
      # стоит о шаблонах 2/3 prompt-kit; DR-промпт, упомянувший ADR, — его
      # «Допустимое попадание», а не находка.
      packet_patterns:
        - '\bплан\w*\b'
        - '\bplan\b'
        - '\bреализ\w*'
        - '\bimplement'
        - '\bрепозитор\w*'
        - '\brepo\b'
        - '\bветк\w*'
        - '\bbranch\b'
        - '\bPR\b'
        - '\bкоммит\w*'
        - '\bтест\w*'
        - '\bpytest\b'
        - 'Claude\s+Code'
        - 'plan[-\s]mode'
      sources_pattern: '^\s*(?:[-*+•]\s*)?\**\s*Sources\b'
      anchor_patterns:
        - '\bADR[-\s]?\d+'
        - '\bPDR[-\s]?\d+'
        - '\bEMV-DL[-\s]?\d+'
        - '\bR-[A-ZА-ЯЁ]+-\d+'
        - '§\s*\d+'
        - '\[\[[^\]]+\]\]'
        - '[\w./-]+\.(?:md|ya?ml)\b'
      # Область трейлера: до первой пустой строки, но не длиннее окна. Прежние
      # 3 строки обрезали трейлер из четырёх якорей — счёт шёл по трети списка.
      anchor_window: 20
      min_anchors: 1
      # «Что ограничивает»: после последнего якоря строки — разделитель и текст
      # такой длины. Якорь без него называет источник, не называя связи.
      constraint_split: '[—–:-]'
      min_constraint_chars: 12
